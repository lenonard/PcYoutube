name: PcYoutube Windows Native / CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  YTDLP_VERSION: "2026.08.19"
  MPV_TAG: "2026-09-29-b4b5d69a44"
  MPV_ARCHIVE: "mpv-x86_64-20260929-git-b4b5d69a44.7z"

jobs:
  build-and-test:
    name: MSVC / Windows 10 target
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify tools and install only if missing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command cmake.exe -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
            $env:Path += ";C:\Program Files\CMake\bin;C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip.commandline -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC cl.exe was not found after enabling the Visual Studio developer environment."
          }

          cmake --version
          ninja --version
          7z | Select-Object -First 2
          Write-Host "MSVC: $((Get-Command cl.exe).Source)"

      - name: Restore CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-x64-msvc-pcyoutube-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-msvc-pcyoutube-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
            "-DCMAKE_SYSTEM_VERSION=10.0"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify output
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "out\PcYoutube.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "out\PcYoutube.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "PcYoutube self-test failed with exit code $($process.ExitCode)"
          }
          Write-Host "PcYoutube v0.3 core self-test passed."

      - name: Bundle yt-dlp and mpv audio engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $PWD "out\tools"
          $mpvDir = Join-Path $tools "mpv"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null

          $ytDlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/download/${{ env.YTDLP_VERSION }}/yt-dlp.exe"
          $ytDlpPath = Join-Path $tools "yt-dlp.exe"
          Invoke-WebRequest -Uri $ytDlpUrl -OutFile $ytDlpPath

          $mpvUrl = "https://github.com/zhongfly/mpv-winbuild/releases/download/${{ env.MPV_TAG }}/${{ env.MPV_ARCHIVE }}"
          $mpvArchivePath = Join-Path $env:RUNNER_TEMP "pcyoutube-mpv.7z"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $mpvArchivePath
          & 7z.exe x $mpvArchivePath "-o$mpvDir" -y | Out-Host

          $mpvExe = Get-ChildItem -Path $mpvDir -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpvExe) {
            throw "mpv.exe was not found after extracting the archive."
          }

          $expectedMpv = Join-Path $mpvDir "mpv.exe"
          if ($mpvExe.FullName -ne $expectedMpv) {
            Copy-Item -Path (Join-Path $mpvExe.DirectoryName "*") -Destination $mpvDir -Recurse -Force
          }

          if (-not (Test-Path $ytDlpPath)) {
            throw "yt-dlp.exe missing from packaged tools."
          }
          if (-not (Test-Path $expectedMpv)) {
            throw "mpv.exe missing from packaged tools."
          }

          & $ytDlpPath --version
          & $expectedMpv --version | Select-Object -First 4

          Copy-Item README.md out\README.md -Force
          Copy-Item THIRD_PARTY.md out\THIRD_PARTY.md -Force

      - name: Stage artifact preserving out folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force out artifact\out

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: PcYoutube-audio-v0.3-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
