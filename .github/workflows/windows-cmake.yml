name: PcYoutube Windows Native / CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  YTDLP_VERSION: "2026.08.19"
  DENO_VERSION: "v2.9.7"
  DENO_ARCHIVE: "deno-x86_64-pc-windows-msvc.zip"
  MPV_TAG: "2026-09-29-b4b5d69a44"
  MPV_ARCHIVE: "mpv-x86_64-20260929-git-b4b5d69a44.7z"

jobs:
  build-and-test:
    name: MSVC / Windows 10 target
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify tools and install only if missing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command cmake.exe -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
            $env:Path += ";C:\Program Files\CMake\bin;C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip.commandline -y --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC cl.exe was not found after enabling the Visual Studio developer environment."
          }

          cmake --version
          ninja --version
          7z | Select-Object -First 2
          Write-Host "MSVC: $((Get-Command cl.exe).Source)"

      - name: Restore CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-x64-msvc-pcyoutube-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-x64-msvc-pcyoutube-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
            "-DCMAKE_SYSTEM_VERSION=10.0"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify output and version metadata
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "out\PcYoutube.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, FileVersion
          if ($info.ProductVersion -notlike "0.7.0*") {
            throw "Expected ProductVersion 0.7.0, got $($info.ProductVersion)"
          }

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Run native self-test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "out\PcYoutube.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "PcYoutube self-test failed with exit code $($process.ExitCode)"
          }
          Write-Host "PcYoutube v0.7 core self-test passed."

      - name: Bundle yt-dlp, Deno and mpv runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $PWD "out\tools"
          $mpvDir = Join-Path $tools "mpv"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null

          # yt-dlp: official Windows executable. Official builds include yt-dlp-ejs.
          $ytDlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/download/${{ env.YTDLP_VERSION }}/yt-dlp.exe"
          $ytDlpPath = Join-Path $tools "yt-dlp.exe"
          Invoke-WebRequest -Uri $ytDlpUrl -OutFile $ytDlpPath

          # Deno is the yt-dlp-recommended JavaScript runtime for YouTube challenge solving.
          $denoUrl = "https://github.com/denoland/deno/releases/download/${{ env.DENO_VERSION }}/${{ env.DENO_ARCHIVE }}"
          $denoArchive = Join-Path $env:RUNNER_TEMP "pcyoutube-deno.zip"
          Invoke-WebRequest -Uri $denoUrl -OutFile $denoArchive
          Expand-Archive -Path $denoArchive -DestinationPath $tools -Force
          $denoPath = Join-Path $tools "deno.exe"

          # mpv audio engine.
          $mpvUrl = "https://github.com/zhongfly/mpv-winbuild/releases/download/${{ env.MPV_TAG }}/${{ env.MPV_ARCHIVE }}"
          $mpvArchivePath = Join-Path $env:RUNNER_TEMP "pcyoutube-mpv.7z"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $mpvArchivePath
          & 7z.exe x $mpvArchivePath "-o$mpvDir" -y | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to extract mpv with exit code $LASTEXITCODE."
          }

          $mpvExe = Get-ChildItem -Path $mpvDir -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpvExe) {
            throw "mpv.exe was not found after extracting the archive."
          }

          $expectedMpv = Join-Path $mpvDir "mpv.exe"
          if ($mpvExe.FullName -ne $expectedMpv) {
            Copy-Item -Path (Join-Path $mpvExe.DirectoryName "*") -Destination $mpvDir -Recurse -Force
          }

          foreach ($required in @($ytDlpPath, $denoPath, $expectedMpv)) {
            if (-not (Test-Path $required)) {
              throw "Required runtime missing from package: $required"
            }
          }

          & $ytDlpPath --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp version check failed." }
          & $denoPath --version | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { throw "Deno version check failed." }
          Get-Item $expectedMpv | Format-List FullName, Length, LastWriteTime

          # Exercise the same full extraction path used by Play. GitHub-hosted runner IPs can
          # occasionally receive YouTube's anti-bot challenge. That is a network/account gate,
          # not a broken bundled runtime, so report it as inconclusive rather than failing the build.
          $smokeVideo = "https://www.youtube.com/watch?v=M7lc1UVf-VE"
          $smokeOutput = & $ytDlpPath `
            --no-config --no-playlist --no-warnings --no-progress `
            --js-runtimes "deno:$denoPath" `
            --simulate --format "bestaudio" --print "%(url)s" $smokeVideo 2>&1
          $smokeExit = $LASTEXITCODE
          $smokeOutput | Out-Host
          $smokeText = ($smokeOutput | Out-String)

          if ($smokeExit -eq 0) {
            $directUrl = $smokeOutput | Where-Object { "$_" -match '^https?://' } | Select-Object -First 1
            if (-not $directUrl) {
              throw "YouTube resolve smoke test exited successfully but returned no direct media URL."
            }
            Write-Host "YouTube resolve smoke test PASS: direct media URL received."
          } elseif ($smokeText -match "Sign in to confirm you.*not a bot" -or
                    $smokeText -match "confirm you.*not a bot") {
            Write-Warning "YouTube challenged the GitHub runner IP. yt-dlp, Deno and mpv packaging checks passed; live YouTube resolve is inconclusive on this CI host."
            $global:LASTEXITCODE = 0
          } else {
            throw "YouTube resolve smoke test failed with exit code $smokeExit for a reason other than the known CI bot challenge."
          }

          Copy-Item README.md out\README.md -Force
          Copy-Item THIRD_PARTY.md out\THIRD_PARTY.md -Force

          $hashLines = @()
          foreach ($item in @(
              @{ Path = "out\PcYoutube.exe"; Name = "PcYoutube.exe" },
              @{ Path = "out\tools\yt-dlp.exe"; Name = "tools/yt-dlp.exe" },
              @{ Path = "out\tools\deno.exe"; Name = "tools/deno.exe" },
              @{ Path = "out\tools\mpv\mpv.exe"; Name = "tools/mpv/mpv.exe" }
          )) {
              $hash = (Get-FileHash $item.Path -Algorithm SHA256).Hash.ToLowerInvariant()
              $hashLines += "$hash  $($item.Name)"
          }
          Set-Content -Path out\SHA256SUMS.txt -Value $hashLines -Encoding ascii
          Get-Content out\SHA256SUMS.txt

      - name: Verify release layout
        shell: pwsh
        run: |
          $required = @(
            "out\PcYoutube.exe",
            "out\tools\yt-dlp.exe",
            "out\tools\deno.exe",
            "out\tools\mpv\mpv.exe",
            "out\README.md",
            "out\SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Release layout is missing $path" }
          }
          Get-ChildItem out -Recurse -File | ForEach-Object {
            Write-Host $_.FullName.Substring((Resolve-Path out).Path.Length + 1)
          }

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: PcYoutube-Music-v0.7-windows-x64
          path: out/
          if-no-files-found: error
          retention-days: 7
